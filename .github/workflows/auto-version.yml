# ─────────────────────────────────────────────────────────────────────
# NEON CRUSH · versionado semántico automático
#
# Cada vez que se abre o actualiza un Pull Request, este workflow:
#   1. Lee la versión actual (const APP_VERSION = 'vX.Y.Z') en index.html
#   2. Incrementa el número de PATCH  (v1.1.0 -> v1.1.1)
#   3. Hace commit del cambio en la propia rama del PR, usando el
#      TÍTULO del PR como "motivo" del bump.
#
# Notas:
#   * Para saltos de MINOR / MAJOR, edita APP_VERSION manualmente en el PR.
#   * Solo funciona en PRs creados desde ramas del mismo repositorio
#     (los forks no permiten escribir de vuelta por seguridad).
#   * El guard "neon-crush-bot" evita un bucle infinito de commits.
# ─────────────────────────────────────────────────────────────────────
name: Auto Version Bump

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama del PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Evitar bucle del bot
        id: guard
        run: |
          LAST_AUTHOR=$(git log -1 --pretty=%an)
          if [ "$LAST_AUTHOR" = "neon-crush-bot" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "El último commit ya es del bot, se omite el bump."
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Incrementar versión (patch) e inyectar motivo del PR
        if: steps.guard.outputs.skip == '0'
        id: bump
        run: |
          FILE=index.html
          CURRENT=$(grep -o "APP_VERSION = 'v[0-9]*\.[0-9]*\.[0-9]*'" "$FILE" | head -1 | grep -o "[0-9]*\.[0-9]*\.[0-9]*")
          if [ -z "$CURRENT" ]; then
            echo "No se encontró APP_VERSION en $FILE"; exit 1
          fi
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          sed -i "s/APP_VERSION = 'v$CURRENT'/APP_VERSION = 'v$NEW'/" "$FILE"
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Versión: v$CURRENT -> v$NEW"

      - name: Commit del bump con el motivo del PR
        if: steps.guard.outputs.skip == '0'
        run: |
          git config user.name  "neon-crush-bot"
          git config user.email "neon-crush-bot@users.noreply.github.com"
          git add index.html
          git commit -m "chore(release): v${{ steps.bump.outputs.new_version }} — ${{ github.event.pull_request.title }} [auto]"
          git push origin "HEAD:${{ github.head_ref }}"
